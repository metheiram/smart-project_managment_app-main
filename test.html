{% load static %}
<!DOCTYPE html>
<html lang="en" class="bg-gray-100 text-gray-800">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Projora</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-3xl font-bold mb-4">Admin Dashboard - Projora</h1>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-6">
      <div class="bg-white shadow rounded-xl p-6">
        <h2 class="text-xl font-semibold">Total Projects</h2>
        <p class="text-3xl mt-2 text-blue-500">{{ project_count }}</p>
      </div>

      <div class="bg-white shadow rounded-xl p-6">
        <h2 class="text-xl font-semibold">Total Tasks</h2>
        <p class="text-3xl mt-2 text-green-500">{{ task_count }}</p>
      </div>

      <div class="bg-white shadow rounded-xl p-6">
        <h2 class="text-xl font-semibold">Total Users</h2>
        <p class="text-3xl mt-2 text-purple-500">{{ user_count }}</p>
      </div>
    </div>

    <div class="mt-8">
      <a href="/admin/" class="inline-block mt-4 bg-gray-800 text-white px-6 py-2 rounded hover:bg-gray-700 transition">Go to Django Admin</a>
    </div>
  </div>
</body>
</html>
