{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Management Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .calendar-day {
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-900">
  <div class="flex">
    <!-- Sidebar -->
    <aside class="bg-gray-800 text-white w-64 min-h-screen p-6">
      <div class="mb-8">
        <img src="/logo.png" alt="Logo" class="w-12 h-12 mx-auto hover:scale-110 transition-transform duration-300" />
        <h1 class="text-center text-xl font-bold mt-2">Projora</h1>
      </div>

      <nav>
        <ul class="space-y-4">
          <li><a href="{% url 'dashboard' %}" class="block hover:bg-purple-800 p-2 rounded-md">Home</a></li>
          <li><a href="{% url 'project:project_tab' %}" class="block hover:bg-purple-800 p-2 rounded-md">Project</a></li>
          <li><a href="{% url 'tasks:tasks_tab' %}" class="block hover:bg-purple-800 p-2 rounded-md">Tasks</a></li>
          <li><a href="{% url 'notification:notification' %}" class="block hover:bg-purple-800 p-2 rounded-md">Notifications</a></li>
          <li><a href="{% url 'users:settings' %}" class="block hover:bg-purple-800 p-2 rounded-md">Settings</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 p-6">
      <header class="flex justify-between items-center mb-6">
        <h1 class="text-2xl text-white font-bold hover:scale-105 transition-transform duration-500">
          Welcome To, <span class="bg-gradient-to-r from-cyan-400 to-purple-500 text-transparent bg-clip-text">User Dashboard</span>
        </h1>
        <a href="{% url 'users:settings' %}">
          <img src="/user-profile.jpg" class="w-10 h-10 rounded-full hover:scale-110 transition-transform duration-300" />
        </a>
      </header>

      <!-- Calendar -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="col-span-1 text-white bg-gray-800 shadow-md rounded-lg p-6">
          <div class="flex justify-between mb-4">
            <button id="prevMonth" class="text-purple-400">&#8592;</button>
            <h2 id="calendarMonth" class="text-xl font-bold"></h2>
            <button id="nextMonth" class="text-purple-400">&#8594;</button>
          </div>
          <div class="grid grid-cols-7 gap-2 text-center">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            <div id="calendarDays" class="col-span-7 grid grid-cols-7 gap-2"></div>
          </div>
        </div>

        <!-- Today's Tasks -->
        <div class="col-span-2 bg-gray-800 shadow-md rounded-lg p-6">
          <h2 class="text-xl font-bold mb-4 text-white">Tasks</h2>
          <ul id="task-list" class="space-y-4 text-white">
            <li class="text-gray-400">Click a calendar date to see tasks.</li>
          </ul>
        </div>
      </div>

      <!-- Projects -->
      <div class="grid grid-cols-1 gap-6 mt-6">
        <div class="bg-gray-800 shadow-md rounded-lg p-6">
          <h2 class="text-xl font-bold mb-4 text-white">Projects</h2>
          <div id="project-list" class="space-y-4 text-white">
            <div class="text-gray-400">Click a calendar date to see projects.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const calendarDaysContainer = document.getElementById('calendarDays');
    const calendarMonth = document.getElementById('calendarMonth');
    const taskList = document.getElementById('task-list');
    const projectList = document.getElementById('project-list');
    let currentDate = new Date();

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startDay = firstDay.getDay();

      calendarMonth.textContent = `${firstDay.toLocaleString('default', { month: 'long' })}, ${year}`;
      calendarDaysContainer.innerHTML = '';

      for (let i = 0; i < startDay; i++) {
        const emptyDiv = document.createElement('div');
        calendarDaysContainer.appendChild(emptyDiv);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${(month + 1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
        const dayDiv = document.createElement('div');
        dayDiv.className = 'calendar-day text-white cursor-pointer hover:bg-purple-700 rounded p-1';
        dayDiv.textContent = day;
        dayDiv.dataset.date = dateStr;
        dayDiv.addEventListener('click', () => handleDateClick(dateStr));
        calendarDaysContainer.appendChild(dayDiv);
      }
    }

    function handleDateClick(dateStr) {
      document.querySelectorAll('.calendar-day').forEach(d => d.classList.remove('bg-purple-700'));
      document.querySelector(`[data-date="${dateStr}"]`).classList.add('bg-purple-700');

      fetch(`/tasks/by-date/?date=${dateStr}`)
  .then(res => res.json())
  .then(data => {
    taskList.innerHTML = '';
    if (data.tasks?.length) {
      data.tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'bg-gray-700 p-4 rounded shadow';
        li.innerHTML = `<strong>${task.title}</strong><br/><span>${task.description}</span><br/><span class="text-sm text-gray-300">Status: ${task.status}</span><br/><span class="text-sm text-gray-400">Project: ${task.project}</span>`;
        taskList.appendChild(li);
      });
    } else {
      taskList.innerHTML = '<li class="text-gray-400">No tasks for this date.</li>';
    }
  });


      fetch(`/project/by-date/?date=${dateStr}`) 
  .then(res => res.json())
  .then(data => {
    console.log("Fetched projects: ", data);  // ✅ Add debug log
    projectList.innerHTML = '';
    if (data.projects?.length) {
      data.projects.forEach(project => {
        console.log("Rendering project:", project);  // ✅ Another debug
        const div = document.createElement('div');
        div.className = 'flex justify-between items-center';
        div.innerHTML = `
          <div>
            <strong>${project.title}</strong>
            <p class="text-sm text-gray-300">${project.description}</p>
            <p class="text-sm text-gray-400">Status: ${project.status}</p>
          </div>
          <button class="bg-gradient-to-r from-cyan-400 to-purple-500 text-white px-4 py-2 rounded-full hover:scale-110 transition-transform duration-300">View</button>
        `;
        projectList.appendChild(div);
      });
    } else {
      projectList.innerHTML = '<div class="text-gray-400">No projects for this date.</div>';
    }
  });

    }

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
