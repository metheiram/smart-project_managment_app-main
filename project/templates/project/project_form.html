<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create/Edit Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #10182F;
            font-family: 'Segoe UI', sans-serif;
            color: #ffffff;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 30px 40px;
            background: linear-gradient(135deg, #1C1C2E, #1E2B4A);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            color: #00AEEF;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #ccc;
        }

        input[type="text"],
        textarea,
        select,
        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            background-color: #2c2f48;
            color: #fff;
            font-size: 15px;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
        }

        .form-actions button {
            background-color: #00AEEF;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .form-actions button:hover {
            background-color: #008FCC;
        }

        .cancel-btn {
            background-color: #FF4C61;
        }

        .cancel-btn:hover {
            background-color: #d33f52;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Create / Edit Project</h2>
        <form method="post">
            {% csrf_token %}
            
            <label for="id_title">Project Title</label>
            {{ form.title }}

            <label for="id_description">Description</label>
            {{ form.description }}

            <label for="id_status">Status</label>
            {{ form.status }}

            <label for="id_start_date">Start Date</label>
            {{ form.start_date }}

            <label for="id_end_date">End Date</label>
            {{ form.end_date }}

            <label for="id_assigned_users">Assign Users</label>
            {{ form.assigned_users }}

            <div class="form-actions">
                <button type="submit">Save</button>
                <a href="{% url 'project:project_tab' %}">
                    <button type="button" class="cancel-btn">Cancel</button>
                </a>
            </div>
        </form>
    </div>

</body>
</html>
